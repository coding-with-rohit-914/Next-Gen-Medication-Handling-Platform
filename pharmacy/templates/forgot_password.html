<!DOCTYPE html>
<html>

<head>
	<title>Forgot Password</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

	<style>
		body {
			font-family: 'Poppins', sans-serif;
			background: linear-gradient(135deg, #f72585, #7209b7);
			height: 100vh;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.forgot-card {
			background: #ffffff;
			padding: 40px 30px;
			border-radius: 15px;
			box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
			width: 100%;
			max-width: 450px;
			opacity: 0;
			transform: scale(0.95);
			transition: all 0.5s ease-in-out;
		}

		.forgot-card.show {
			opacity: 1;
			transform: scale(1);
		}

		h2 {
			text-align: center;
			margin-bottom: 25px;
			font-weight: 600;
			color: #7209b7;
		}

		.form-control {
			border-radius: 10px;
		}

		.btn-send {
			background-color: #7209b7;
			color: white;
			border: none;
			border-radius: 10px;
			padding: 10px;
			transition: background-color 0.3s ease;
		}

		.btn-send:hover {
			background-color: #560bad;
		}

		.message {
			font-size: 0.95rem;
			margin-bottom: 15px;
		}
	</style>
</head>

<body>
	<div class="forgot-card" id="forgotCard">
		<h2>Forgot Password</h2>

		{% if messages %}
		{% for message in messages %}
		<p class="message" style="color: {% if message.tags == 'error' % }red{% else %}green{% endif %};">
			{{ message }}
		</p>
		{% endfor %}
		{% endif %}

		<form method="post">
			{% csrf_token %}
			<div class="mb-3">
				<input type="email" name="email" class="form-control" placeholder="Enter your registered email"
					required>
			</div>
			<!-- Optional Phone Field -->
			<!--             
            <div class="mb-3">
                <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
            </div>
            -->
			<div class="d-grid">
				<button type="submit" class="btn btn-send">Send OTP</button>
			</div>
		</form>
	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Entry Animation -->
	<script>
		window.addEventListener('DOMContentLoaded', () => {
			const card = document.getElementById('forgotCard');
			setTimeout(() => {
				card.classList.add('show');
			}, 200);
		});
	</script>
</body>

</html>
