<!DOCTYPE html>
<html>

<head>
    <title>Signup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #20c997, #0d6efd);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .signup-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-in-out;
        }

        .signup-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            color: #0d6efd;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-signup {
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-signup:hover {
            background-color: #084298;
        }

        .login-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #0d6efd;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-card" id="signupCard">
        <h2>Signup</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-signup">Signup</button>
            </div>
        </form>
        <a href="{% url 'login' %}" class="login-link">Already have an account?</a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Smooth entry animation JS -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('signupCard');
            setTimeout(() => {
                card.classList.add('show');
            }, 200);
        });
    </script>
</body>

</html>
